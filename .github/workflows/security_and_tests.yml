name: Security, Lint & Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  secret-scan:
    name: Secret Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Secret Scanner
        run: |
          python backend/scripts/scan_secrets.py --history

  backend-tests:
    name: Backend Tests & Coverage
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-randomly

      - name: Run Pytest with Coverage
        run: |
          pytest backend/tests --cov=backend/app --cov-report=term-missing --cov-report=html

  frontend-tests:
    name: Frontend Lint & Tests
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci

      - name: Run ESLint
        run: |
          npm --prefix frontend run lint

      - name: Run Vitest Suite
        run: |
          npm --prefix frontend test
